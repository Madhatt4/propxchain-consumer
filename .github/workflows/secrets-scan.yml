name: secrets scan (gitleaks)

on:
  pull_request:
  push:
    branches:
      - main
  # Manual re-run — see the note in ci.yml. Also useful for scanning on demand
  # after a history rewrite.
  workflow_dispatch:

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action@v2 calls the GitHub API to enumerate a PR's commits on
      # pull_request events; without this it 403s ("Resource not accessible by
      # integration") and the scan crashes before running.
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
