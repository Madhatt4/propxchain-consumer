name: Deploy edge functions

# Deploys this repo's Supabase edge functions on merge to main, then checks
# each one answers a preflight from the app.
#
# Before this existed, functions were deployed by hand and drifted from main:
# the shared CORS list gained the iPhone app's origin in PR 91, but the live
# functions kept the old list until someone redeployed them.
#
# Only the functions a push touched are deployed, so a function that was
# hot-fixed live is never silently overwritten by an unrelated merge. A change
# under _shared/ redeploys every function, because they all bundle it. "Run
# workflow" deploys all of them, or a comma-separated list.
#
# Every function here authenticates in code (the project's ES256 JWTs can't be
# verified by the gateway), so all deploy with --no-verify-jwt.
#
# Secret: SUPABASE_ACCESS_TOKEN, a personal access token from
# supabase.com/dashboard/account/tokens.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:
    inputs:
      functions:
        description: "Functions to deploy: all, or a comma-separated list"
        default: all
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

env:
  PROJECT_REF: bhacvhrbdmlkawpkhklq
  SUPABASE_CLI: supabase@2.119.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the access token is present
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN is missing. Add it under Settings, Secrets and variables, Actions."
            exit 1
          fi

      - name: Work out which functions to deploy
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ github.event.inputs.functions }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          all=$(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts \
            | cut -d/ -f3 | grep -v '^_' | sort)

          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$REQUESTED" = "all" ]; then
              targets="$all"
            else
              targets=$(echo "$REQUESTED" | tr ',' '\n' | tr -d ' ' | grep -v '^$')
            fi
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            targets="$all"
          else
            changed=$(git diff --name-only "$BEFORE" "$AFTER" -- supabase/functions .github/workflows/deploy-functions.yml)
            if echo "$changed" | grep -qE '^(supabase/functions/_shared/|\.github/workflows/deploy-functions\.yml$)'; then
              targets="$all"
            else
              targets=$(echo "$changed" | grep '^supabase/functions/' | cut -d/ -f3 | sort -u)
            fi
          fi

          # Keep only real function folders (a deleted function has none).
          final=""
          for f in $targets; do
            if [ -f "supabase/functions/$f/index.ts" ]; then
              final="$final $f"
            else
              echo "::warning::Skipping $f: no supabase/functions/$f/index.ts"
            fi
          done
          echo "Deploying:$final"
          echo "TARGETS=$final" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Deploy
        if: env.TARGETS != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for f in $TARGETS; do
            echo "::group::$f"
            npx --yes "$SUPABASE_CLI" functions deploy "$f" \
              --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
            echo "::endgroup::"
          done

      - name: Check each function answers the app
        # A preflight from the iPhone app's origin must come back with an
        # Allow-Origin header. That proves the function boots and that its
        # CORS list includes the app, which is the failure that started this.
        if: env.TARGETS != ''
        run: |
          fail=0
          for f in $TARGETS; do
            headers=$(curl -sS -o /dev/null -D - -X OPTIONS --max-time 30 \
              -H "Origin: capacitor://localhost" \
              -H "Access-Control-Request-Method: POST" \
              "https://$PROJECT_REF.supabase.co/functions/v1/$f" | tr -d '\r')
            status=$(echo "$headers" | awk 'toupper($1) ~ /^HTTP/ {code=$2} END {print code}')
            allow=$(echo "$headers" | grep -i '^access-control-allow-origin:' | cut -d' ' -f2-)
            if [ "${status:0:1}" = "2" ] && { [ "$allow" = "capacitor://localhost" ] || [ "$allow" = "*" ]; }; then
              echo "ok   $f ($status, $allow)"
            else
              echo "::error::$f answered $status with Allow-Origin '${allow}'"
              fail=1
            fi
          done
          exit $fail
