# UPRN -> exact coordinate for the free property check (see src/index.ts).
# Deploy: build the shards first (scripts/build-shards.mjs), then `npx wrangler deploy`.
name = "propxchain-uprn"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[assets]
# 10,000 gzip shards of OS Open UPRN, built locally and gitignored.
directory = "./shards"
binding = "ASSETS"
# Every request goes through the Worker; the shards are never served raw.
run_worker_first = true
